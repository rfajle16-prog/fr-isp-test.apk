<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FR ISP TEST</title>
<style>
  :root {
    --bg-deep: #040d1e;
    --card-bg: rgba(10, 32, 68, 0.78);
    --cyan: #00e5ff;
    --cyan-soft: #67e8f9;
    --border-glow: rgba(0, 229, 255, 0.35);
    --text-main: #e6f7ff;
    --ok: #00e699;
    --warn: #fbbf24;
    --danger: #ff5c7c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: sans-serif;
    background: radial-gradient(circle at 20% 0%, #0d316b 0%, var(--bg-deep) 55%, #020814 100%);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: linear-gradient(135deg, rgba(13, 52, 117, 0.96), rgba(0, 172, 212, 0.28));
    border-bottom: 1.5px solid var(--border-glow);
    padding: 18px 16px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .brand-title { font-size: 1.55rem; font-weight: 800; letter-spacing: 2px; color: var(--cyan); }
  .brand-sub { font-size: 0.8rem; color: var(--cyan-soft); margin-top: 3px; }
  main { flex: 1; width: 100%; max-width: 640px; margin: 0 auto; padding: 16px 14px 28px; }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border-glow);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 8px 24px rgba(2, 10, 28, 0.55);
  }
  .btn-primary {
    background: linear-gradient(135deg, #00c6ff, #0072ff);
    color: #ffffff;
    border: none;
    padding: 13px 20px;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
  }
  .progress-wrap { display: none; margin-top: 14px; }
  .progress-bar-bg { width: 100%; height: 10px; background: rgba(255, 255, 255, 0.1); border-radius: 99px; overflow: hidden; }
  .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #0072ff, #00e5ff); transition: width 0.35s ease; }
  .step-text { font-size: 0.85rem; color: var(--cyan-soft); margin-top: 8px; text-align: center; }
  .status-pill { display: inline-block; padding: 6px 18px; border-radius: 999px; font-weight: 700; font-size: 0.95rem; margin-bottom: 12px; }
  .pill-ok { background: rgba(0, 230, 153, 0.15); color: var(--ok); border: 1px solid var(--ok); }
  .pill-warn { background: rgba(251, 191, 36, 0.15); color: var(--warn); border: 1px solid var(--warn); }
  .pill-danger { background: rgba(255, 92, 124, 0.15); color: var(--danger); border: 1px solid var(--danger); }
  .speed-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  .speed-box {
    background: linear-gradient(160deg, rgba(13, 55, 118, 0.7), rgba(0, 180, 216, 0.16));
    border: 1px solid rgba(0, 229, 255, 0.35);
    border-radius: 14px;
    padding: 14px;
    text-align: center;
  }
  .speed-label { font-size: 0.8rem; color: var(--cyan-soft); margin-bottom: 4px; }
  .speed-val { font-size: 1.65rem; font-weight: 800; color: #ffffff; }
  .speed-unit { font-size: 0.8rem; color: var(--cyan); font-weight: 600; }
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .info-item {
    background: rgba(4, 15, 36, 0.65);
    border: 1px solid rgba(56, 189, 248, 0.2);
    border-radius: 10px;
    padding: 10px;
  }
  .info-k { font-size: 0.74rem; color: #8ab4d8; }
  .info-v { font-size: 0.9rem; font-weight: 700; color: #fff; margin-top: 2px; }
  .badge { display: inline-block; font-size: 0.7rem; padding: 2px 7px; border-radius: 5px; margin-left: 5px; }
  .badge-ok { background: rgba(0, 230, 153, 0.2); color: var(--ok); }
  .badge-warn { background: rgba(251, 191, 36, 0.2); color: var(--warn); }
  .badge-danger { background: rgba(255, 92, 124, 0.2); color: var(--danger); }
  .section-title { font-size: 0.95rem; font-weight: 700; color: var(--cyan); margin-bottom: 10px; border-left: 3px solid var(--cyan); padding-left: 8px; }
  .ping-row { display: flex; justify-content: space-between; align-items: center; padding: 9px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.08); font-size: 0.84rem; }
  .finding-box { padding: 10px 12px; border-radius: 10px; margin-bottom: 8px; background: rgba(4, 15, 36, 0.7); border-left: 4px solid var(--cyan); }
  .finding-ok { border-left-color: var(--ok); }
  .finding-warn { border-left-color: var(--warn); }
  .finding-title { font-weight: 700; font-size: 0.9rem; color: #fff; }
  .finding-desc { font-size: 0.83rem; color: #cbe6ff; margin-top: 2px; }
  textarea#shortReport { width: 100%; min-height: 220px; background: #030b1a; color: #b8f3ff; border: 1px solid rgba(0, 229, 255, 0.45); border-radius: 12px; padding: 12px; font-size: 0.86rem; }
  .btn-copy { background: linear-gradient(135deg, #00e5ff, #0284c7); color: #021024; border: none; padding: 12px; border-radius: 12px; font-weight: 800; cursor: pointer; width: 100%; margin-top: 10px; }
  #resultsArea { display: none; }
</style>
</head>
<body>
  <header>
    <div class="brand-title">FR ISP TEST</div>
    <div class="brand-sub">রাউটার, ডুয়েল ব্যান্ড, ফাইবার ও ব্যান্ডউইথ ডায়াগনস্টিক</div>
  </header>

  <main>
    <div class="card">
      <button class="btn-primary" id="startBtn" onclick="startTest()">নেটওয়ার্ক টেস্ট শুরু করুন</button>
      <div class="progress-wrap" id="progressWrap">
        <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressBar"></div></div>
        <div class="step-text" id="stepText">প্রস্তুত...</div>
      </div>
    </div>

    <div id="resultsArea">
      <div style="text-align:center;"><span class="status-pill" id="statusPill"></span></div>

      <div class="speed-grid">
        <div class="speed-box">
          <div class="speed-label">ডাউনলোড স্পিড</div>
          <div class="speed-val" id="dlVal">--</div>
          <div class="speed-unit">Mbps <span class="badge badge-ok" id="dlBadge">GOOD</span></div>
        </div>
        <div class="speed-box">
          <div class="speed-label">আপলোড স্পিড</div>
          <div class="speed-val" id="ulVal">--</div>
          <div class="speed-unit">Mbps <span class="badge badge-ok" id="ulBadge">GOOD</span></div>
        </div>
      </div>

      <div class="card">
        <div class="section-title">রাউটার, লোকাল লাইন ও ব্যান্ডউইথের চাপ</div>
        <div id="layerHealthList"></div>
      </div>

      <div class="card">
        <div class="section-title">সংযোগ, Wi-Fi ব্যান্ড ও ISP তথ্য</div>
        <div class="info-grid" id="infoGrid"></div>
      </div>

      <div class="card">
        <div class="section-title">পিং, জিটার ও রেসপন্স টাইম</div>
        <div id="pingList"></div>
      </div>

      <div class="card">
        <div class="section-title">সংক্ষিপ্ত বাংলা রিপোর্ট (কপি করার জন্য)</div>
        <textarea id="shortReport" readonly></textarea>
        <button class="btn-copy" onclick="copyReport()">রিপোর্ট কপি করুন</button>
      </div>
    </div>
  </main>

<script>
function startTest() {
  document.getElementById('startBtn').disabled = true;
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('resultsArea').style.display = 'none';
  if (window.AndroidBridge && window.AndroidBridge.startTest) {
    window.AndroidBridge.startTest("");
  }
}

window.onNativeProgress = function(pct, msg) {
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('stepText').textContent = msg;
};

window.onNativeResult = function(jsonStr) {
  document.getElementById('progressBar').style.width = '100%';
  document.getElementById('startBtn').disabled = false;
  renderResult(JSON.parse(jsonStr));
};

function renderResult(d) {
  document.getElementById('resultsArea').style.display = 'block';

  const pill = document.getElementById('statusPill');
  pill.textContent = d.overall_status;
  pill.className = 'status-pill pill-' + d.overall_level;

  document.getElementById('dlVal').textContent = d.download.ok ? d.download.mbps : 'সচল';
  document.getElementById('ulVal').textContent = d.upload.ok ? d.upload.mbps : 'সচল';

  const lh = d.layer_health;
  const layerRows = [
    ['রাউটারের অবস্থা', lh.router],
    ['লোকাল লাইনের চাপ (ফাইবার / কেবল)', lh.local_line],
    ['ব্যান্ডউইথের চাপ', lh.bandwidth]
  ];
  document.getElementById('layerHealthList').innerHTML = layerRows.map(([title, item]) =>
    `<div class="finding-box finding-${item.level}"><div class="finding-title">${title}</div><div class="finding-desc">${item.text}</div></div>`
  ).join('');

  const dnsBadge = `<span class="badge badge-${d.dns.level || 'ok'}">${(d.dns.level || 'ok').toUpperCase()}</span>`;
  const infoItems = [
    ['ISP / কোম্পানি', d.isp_info.display],
    ['ঢাকা সময়', d.time_info.short_time + ' BST'],
    ['Wi-Fi ব্যান্ড', d.wifi_band || 'ডুয়েল ব্যান্ড'],
    ['লিংক স্পিড', d.wifi_speed || 'স্বাভাবিক'],
    ['Public IP', d.isp_info.public_ip + ' (' + d.isp_info.location + ')'],
    ['রাউটার IP', d.hop1],
    ['মোবাইল IP', d.local_ip],
    ['DNS (google.com)', (d.dns.ok ? (d.dns.ms + ' ms ') : 'সচল ') + dnsBadge]
  ];
  document.getElementById('infoGrid').innerHTML = infoItems.map(([k, v]) =>
    `<div class="info-item"><div class="info-k">${k}</div><div class="info-v">${v}</div></div>`
  ).join('');

  document.getElementById('pingList').innerHTML = d.pings.map(p => {
    const badge = `<span class="badge badge-${p.level || 'ok'}">${(p.level || 'ok').toUpperCase()}</span>`;
    const right = p.ok ? `Avg ${p.avg}ms | Jitter ${p.jitter}ms | Loss ${p.loss}% ${badge}` : 'সংযোজিত';
    return `<div class="ping-row"><strong>${p.label}<br><small style="color:#8ab4d8">${p.host}</small></strong><span>${right}</span></div>`;
  }).join('');

  document.getElementById('shortReport').value = d.short_report;
  document.getElementById('resultsArea').scrollIntoView({ behavior: 'smooth' });
}

function copyReport() {
  const ta = document.getElementById('shortReport');
  if (window.AndroidBridge && window.AndroidBridge.copyReport) {
    window.AndroidBridge.copyReport(ta.value);
  }
  alert("রিপোর্ট কপি হয়েছে!");
}
</script>
</body>
</html>
