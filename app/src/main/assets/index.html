<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FR ISP TEST</title>
<style>
  :root {
    --bg-deep: #040d1e;
    --bg-mid: #081b38;
    --card-bg: rgba(10, 32, 68, 0.78);
    --blue-accent: #1d6ff2;
    --cyan: #00e5ff;
    --cyan-soft: #67e8f9;
    --border-glow: rgba(0, 229, 255, 0.35);
    --text-main: #e6f7ff;
    --text-muted: #8ab4d8;
    --ok: #00e699;
    --warn: #fbbf24;
    --danger: #ff5c7c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans Bengali', sans-serif;
    background: radial-gradient(circle at 20% 0%, #0d316b 0%, var(--bg-deep) 55%, #020814 100%);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: linear-gradient(135deg, rgba(13, 52, 117, 0.96), rgba(0, 172, 212, 0.28));
    border-bottom: 1.5px solid var(--border-glow);
    padding: 18px 16px;
    text-align: center;
    box-shadow: 0 4px 24px rgba(0, 229, 255, 0.14);
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .brand-title {
    font-size: 1.55rem;
    font-weight: 800;
    letter-spacing: 2px;
    color: var(--cyan);
    text-shadow: 0 0 18px rgba(0, 229, 255, 0.4);
  }
  .brand-sub {
    font-size: 0.8rem;
    color: var(--cyan-soft);
    margin-top: 3px;
    opacity: 0.92;
  }
  main {
    flex: 1;
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    padding: 16px 14px 28px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border-glow);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 8px 24px rgba(2, 10, 28, 0.55);
  }
  .input-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  label {
    display: block;
    font-size: 0.86rem;
    color: var(--cyan-soft);
    margin-bottom: 8px;
    font-weight: 600;
  }
  input[type="number"] {
    flex: 1;
    min-width: 140px;
    background: rgba(4, 15, 36, 0.9);
    border: 1.5px solid rgba(0, 229, 255, 0.4);
    color: #fff;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 1rem;
    outline: none;
  }
  input[type="number"]:focus {
    border-color: var(--cyan);
    box-shadow: 0 0 12px rgba(0, 229, 255, 0.3);
  }
  .btn-primary {
    background: linear-gradient(135deg, #00c6ff, #0072ff);
    color: #ffffff;
    border: none;
    padding: 13px 20px;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 18px rgba(0, 198, 255, 0.35);
    width: 100%;
    margin-top: 10px;
  }
  .btn-primary:disabled { opacity: 0.55; }
  .progress-wrap { display: none; margin-top: 14px; }
  .progress-bar-bg {
    width: 100%;
    height: 10px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 99px;
    overflow: hidden;
    border: 1px solid rgba(0, 229, 255, 0.25);
  }
  .progress-bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #0072ff, #00e5ff);
    transition: width 0.35s ease;
  }
  .step-text { font-size: 0.85rem; color: var(--cyan-soft); margin-top: 8px; text-align: center; }
  .status-pill {
    display: inline-block;
    padding: 6px 14px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
  .pill-ok { background: rgba(0, 230, 153, 0.15); color: var(--ok); border: 1px solid var(--ok); }
  .pill-warn { background: rgba(251, 191, 36, 0.15); color: var(--warn); border: 1px solid var(--warn); }
  .pill-danger { background: rgba(255, 92, 124, 0.15); color: var(--danger); border: 1px solid var(--danger); }
  .speed-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 14px;
  }
  .speed-box {
    background: linear-gradient(160deg, rgba(13, 55, 118, 0.7), rgba(0, 180, 216, 0.16));
    border: 1px solid rgba(0, 229, 255, 0.35);
    border-radius: 14px;
    padding: 14px;
    text-align: center;
  }
  .speed-label { font-size: 0.8rem; color: var(--cyan-soft); margin-bottom: 4px; }
  .speed-val { font-size: 1.65rem; font-weight: 800; color: #ffffff; }
  .speed-unit { font-size: 0.8rem; color: var(--cyan); font-weight: 600; }
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .info-item {
    background: rgba(4, 15, 36, 0.65);
    border: 1px solid rgba(56, 189, 248, 0.2);
    border-radius: 10px;
    padding: 10px;
  }
  .info-k { font-size: 0.74rem; color: var(--text-muted); }
  .info-v { font-size: 0.9rem; font-weight: 700; color: #fff; margin-top: 2px; word-break: break-word; }
  .section-title {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--cyan);
    margin-bottom: 10px;
    border-left: 3px solid var(--cyan);
    padding-left: 8px;
  }
  .ping-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    font-size: 0.84rem;
    gap: 8px;
  }
  .ping-row:last-child { border-bottom: none; }
  .finding-box {
    padding: 10px 12px;
    border-radius: 10px;
    margin-bottom: 8px;
    background: rgba(4, 15, 36, 0.7);
    border-left: 4px solid var(--cyan);
  }
  .finding-ok { border-left-color: var(--ok); }
  .finding-warn { border-left-color: var(--warn); }
  .finding-danger { border-left-color: var(--danger); }
  .finding-title { font-weight: 700; font-size: 0.9rem; margin-bottom: 3px; color: #fff; }
  .finding-desc { font-size: 0.83rem; color: #cbe6ff; line-height: 1.45; }
  textarea#shortReport {
    width: 100%;
    min-height: 245px;
    background: #030b1a;
    color: #b8f3ff;
    border: 1px solid rgba(0, 229, 255, 0.45);
    border-radius: 12px;
    padding: 12px;
    font-family: inherit;
    font-size: 0.86rem;
    line-height: 1.5;
  }
  .btn-copy {
    background: linear-gradient(135deg, #00e5ff, #0284c7);
    color: #021024;
    border: none;
    padding: 12px;
    border-radius: 12px;
    font-size: 0.95rem;
    font-weight: 800;
    cursor: pointer;
    width: 100%;
    margin-top: 10px;
  }
  .copy-msg { text-align: center; font-size: 0.84rem; color: var(--ok); margin-top: 6px; min-height: 18px; }
  footer {
    text-align: center;
    padding: 14px 12px;
    background: linear-gradient(180deg, rgba(4, 13, 30, 0.4), rgba(8, 32, 72, 0.95));
    border-top: 1px solid var(--border-glow);
    font-weight: 800;
    letter-spacing: 2px;
    color: var(--cyan);
    font-size: 0.95rem;
  }
  #resultsArea { display: none; }
</style>
</head>
<body>
  <header>
    <div class="brand-title">FR ISP TEST</div>
    <div class="brand-sub">রাউটার, কেবল, অনু, ফাইবার ও ব্যান্ডউইথ ডায়াগনস্টিক</div>
  </header>

  <main>
    <div class="card">
      <label for="pkgInput">আপনার প্যাকেজ স্পিড (Mbps) — না জানলে খালি রাখুন:</label>
      <div class="input-row">
        <input type="number" id="pkgInput" placeholder="যেমন: 20 বা 30" min="1" max="10000" step="0.5">
      </div>
      <button class="btn-primary" id="startBtn" onclick="startTest()">নেটওয়ার্ক টেস্ট শুরু করুন</button>

      <div class="progress-wrap" id="progressWrap">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressBar"></div>
        </div>
        <div class="step-text" id="stepText">প্রস্তুত...</div>
      </div>
    </div>

    <div id="resultsArea">
      <div style="text-align:center;">
        <span class="status-pill" id="statusPill"></span>
      </div>

      <div class="speed-grid">
        <div class="speed-box">
          <div class="speed-label">ডাউনলোড স্পিড</div>
          <div class="speed-val" id="dlVal">--</div>
          <div class="speed-unit" id="dlEdge">Mbps</div>
        </div>
        <div class="speed-box">
          <div class="speed-label">আপলোড স্পিড</div>
          <div class="speed-val" id="ulVal">--</div>
          <div class="speed-unit">Mbps</div>
        </div>
      </div>

      <div class="card">
        <div class="section-title">রাউটার, লোকাল লাইন ও ব্যান্ডউইথের চাপ</div>
        <div id="layerHealthList"></div>
      </div>

      <div class="card">
        <div class="section-title">সংযোগ ও ISP তথ্য</div>
        <div class="info-grid" id="infoGrid"></div>
      </div>

      <div class="card">
        <div class="section-title">পিং, জিটার ও প্যাকেট লস</div>
        <div id="pingList"></div>
      </div>

      <div class="card">
        <div class="section-title">বিস্তারিত কারণ ও পরামর্শ</div>
        <div id="findingsList"></div>
      </div>

      <div class="card">
        <div class="section-title">সংক্ষিপ্ত বাংলা রিপোর্ট (কপি করার জন্য)</div>
        <textarea id="shortReport" readonly></textarea>
        <button class="btn-copy" onclick="copyReport()">রিপোর্ট কপি করুন (Copy Report)</button>
        <div class="copy-msg" id="copyMsg"></div>
      </div>
    </div>
  </main>

  <footer>FR ISP TEST</footer>

<script>
function esc(str) {
  return String(str ?? '').replace(/[&<>"']/g, m => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}

function startTest() {
  const pkgVal = document.getElementById('pkgInput').value.trim();
  const btn = document.getElementById('startBtn');
  btn.disabled = true;
  document.getElementById('progressWrap').style.display = 'block';
  document.getElementById('resultsArea').style.display = 'none';
  document.getElementById('copyMsg').textContent = '';
  document.getElementById('progressBar').style.width = '5%';
  document.getElementById('stepText').textContent = 'শুরু হচ্ছে...';

  if (window.AndroidBridge && window.AndroidBridge.startTest) {
    window.AndroidBridge.startTest(pkgVal);
  }
}

window.onNativeProgress = function(pct, msg) {
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('stepText').textContent = msg;
};

window.onNativeError = function(errMsg) {
  document.getElementById('startBtn').disabled = false;
  document.getElementById('stepText').textContent = 'ত্রুটি: ' + errMsg;
};

window.onNativeResult = function(jsonStr) {
  document.getElementById('progressBar').style.width = '100%';
  document.getElementById('stepText').textContent = 'সম্পন্ন হয়েছে!';
  document.getElementById('startBtn').disabled = false;
  const d = JSON.parse(jsonStr);
  renderResult(d);
};

function renderResult(d) {
  document.getElementById('resultsArea').style.display = 'block';

  const pill = document.getElementById('statusPill');
  pill.textContent = d.overall_status;
  pill.className = 'status-pill pill-' + d.overall_level;

  document.getElementById('dlVal').textContent = d.download.ok ? d.download.mbps : 'ব্যর্থ';
  document.getElementById('dlEdge').textContent = d.download.ok ? ('Mbps (' + d.download.edge + ')') : 'সংযোগ নেই';
  document.getElementById('ulVal').textContent = d.upload.ok ? d.upload.mbps : 'ব্যর্থ';

  const lh = d.layer_health;
  const layerRows = [
    ['রাউটারের অবস্থা', lh.router],
    ['লোকাল লাইনের চাপ (ONU / কেবল)', lh.local_line],
    ['ব্যান্ডউইথের চাপ', lh.bandwidth]
  ];
  document.getElementById('layerHealthList').innerHTML = layerRows.map(([title, item]) =>
    `<div class="finding-box finding-${esc(item.level)}"><div class="finding-title">${esc(title)}</div><div class="finding-desc">${esc(item.text)}</div></div>`
  ).join('');

  const infoItems = [
    ['ISP / কোম্পানি', d.isp_info.display],
    ['ঢাকা সময়', d.time_info.short_time + ' BST'],
    ['সময়কাল', d.time_info.period_bn],
    ['Public IP', d.isp_info.public_ip + ' (' + d.isp_info.location + ')'],
    ['রাউটার IP (Hop 1)', d.hop1],
    ['মোবাইল IP', d.local_ip],
    ['Hop 2 (ONU/GW)', d.hop2],
    ['DNS (google.com)', d.dns.ok ? (d.dns.ms + ' ms') : 'ব্যর্থ']
  ];
  document.getElementById('infoGrid').innerHTML = infoItems.map(([k, v]) =>
    `<div class="info-item"><div class="info-k">${esc(k)}</div><div class="info-v">${esc(v)}</div></div>`
  ).join('');

  document.getElementById('pingList').innerHTML = d.pings.map(p => {
    const right = p.ok
      ? `Avg ${p.avg}ms | Jitter ${p.jitter}ms | Loss ${p.loss}%`
      : (p.host ? `সংযোগ ব্যর্থ (Loss ${p.loss ?? 100}%)` : 'IP পাওয়া যায়নি');
    return `<div class="ping-row"><strong>${esc(p.label)}<br><small style="color:#8ab4d8">${esc(p.host || '-')}</small></strong><span style="text-align:right">${esc(right)}</span></div>`;
  }).join('');

  document.getElementById('findingsList').innerHTML = d.findings.map(f =>
    `<div class="finding-box finding-${esc(f.level)}"><div class="finding-title">${esc(f.title)}</div><div class="finding-desc">${esc(f.desc)}</div></div>`
  ).join('');

  document.getElementById('shortReport').value = d.short_report;
  document.getElementById('resultsArea').scrollIntoView({ behavior: 'smooth' });
}

function copyReport() {
  const ta = document.getElementById('shortReport');
  const msg = document.getElementById('copyMsg');
  let ok = false;
  if (window.AndroidBridge && window.AndroidBridge.copyReport) {
    ok = window.AndroidBridge.copyReport(ta.value);
  }
  if (ok) {
    msg.textContent = '✓ রিপোর্ট ক্লিপবোর্ডে কপি হয়েছে!';
  } else {
    ta.select();
    ta.setSelectionRange(0, 99999);
    document.execCommand('copy');
    msg.textContent = '✓ রিপোর্ট কপি হয়েছে!';
  }
}
</script>
</body>
</html>
